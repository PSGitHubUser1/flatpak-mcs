id: com.infoy.automcs
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk//24.08
command: auto-mcs

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=home
  - --persist=~/auto-mcs

modules:
  - name: app
    buildsystem: simple
    build-commands:
    - install -Dm755 auto-mcs /app/bin/auto-mcs
    - install -Dm644 com.infoy.automcs.desktop /app/share/applications/com.infoy.automcs.desktop
    - install -Dm644 icon.png /app/share/icons/hicolor/64x64/apps/com.infoy.automcs.png
    sources:
      - type: file
        path: auto-mcs
      - type: file
        path: com.infoy.automcs.desktop
      - type: file
        path: icon.png
